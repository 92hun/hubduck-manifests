apiVersion: apps/v1
kind: Deployment
metadata:
  name: hubduck
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hubduck
  template:
    metadata:
      labels:
        app: hubduck
    spec:
      containers:
        - name: hubduck
          image: ghcr.io/92hun/hubduck:v1.0.2
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              memory: 256Mi
            limits:
              memory: 512Mi
